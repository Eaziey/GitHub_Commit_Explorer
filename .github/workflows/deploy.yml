name: Deploy Gitsplore to Github Pages


on:
  push:
    branches: [main]


permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  deploy:
    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: client


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18


      - name: Install dependencies
        run: npm ci


      - name: Run unit tests
        run: npm run test

      
      - name: Build project
        run: npm run build


      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - name: Deploy to Github Pages
        uses: actions/deploy-pages@v4